name: Build Royal Lynx Engine Prototype

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-engine-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Android Project Structure
        run: |
          mkdir -p android_build/app/src/main/java/com/royal/engine
          mkdir -p android_build/app/src/main/res/values
          
          # 1. Create root settings.gradle
          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://artifact.bytedance.com/repository/releases/' }
              }
          }
          rootProject.name = "RoyalLynxEngine"
          include ':app'
          EOF

          # 2. Create root build.gradle
          cat << 'EOF' > android_build/build.gradle
          buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. Create app/build.gradle with ByteDance Lynx & WebKit
          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.royal.engine'
              compileSdk 34

              defaultConfig {
                  applicationId "com.royal.engine"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-PROTOTYPE"

                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              
              // ByteDance Lynx Native Core Engine
              implementation 'com.bytedance.lynx:lynx:2.14.0'
              
              // AndroidX WebKit Zero-IO Asset Bridge
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          # 4. Create AndroidManifest.xml
          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.HARDWARE_ACCELERATED" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Bellroy - Royal Engine"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Create MainActivity.kt with Bellroy.com Acceleration Pipeline
          cat << 'EOF' > android_build/app/src/main/java/com/royal/engine/MainActivity.kt
          package com.royal.engine

          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var mainEngineView: WebView
              private val targetUrl = "https://bellroy.com"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Initialize Direct Hardware GPU Acceleration
                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  )

                  mainEngineView = WebView(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  }

                  setContentView(mainEngineView)
                  configureEngineSettings()
                  
                  // Warmup & Load Target Store
                  mainEngineView.loadUrl(targetUrl)
              }

              private fun configureEngineSettings() {
                  mainEngineView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      
                      // V8 Engine & GPU Compositing Optimization Flags
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      
                      // Render Pipeline acceleration
                      setRenderPriority(WebSettings.RenderPriority.HIGH)
                  }

                  mainEngineView.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                          // Inject Hardware Layer Compositing CSS
                          val injectGpuCss = """
                              javascript:(function() {
                                  var style = document.createElement('style');
                                  style.innerHTML = '* { -webkit-tap-highlight-color: transparent; transform: translateZ(0); will-change: transform; }';
                                  document.head.appendChild(style);
                              })()
                          """.trimIndent()
                          view?.evaluateJavascript(injectGpuCss, null)
                      }
                  }
              }

              override fun onBackPressed() {
                  if (::mainEngineView.isInitialized && mainEngineView.canGoBack()) {
                      mainEngineView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 6. Setup Gradle Wrapper
          cd android_build
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK with Royal Engine Pipeline
        run: |
          cd android_build
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bellroy-RoyalEngine-Test
          path: android_build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
