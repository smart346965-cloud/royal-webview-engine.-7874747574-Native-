plugins {
    alias(libs.plugins.androidApplication)
}

// 🔥 إضافة المستودعات المفقودة
repositories {
    google()
    mavenCentral()
    
    // 🔐 Facebook Login
    maven {
        url "https://maven.facebook.com/repository"
    }
    
    // 🔐 Microsoft MSAL
    maven {
        url "https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1"
        name "Duo-SDK-Feed"
    }
    maven {
        url "https://maven.microsoft.com/artifactory/public"
    }
    
    // 💳 Braintree / CardinalCommerce
    maven {
        url "https://cardinalcommerceprod.jfrog.io/artifactory/android"
        name "CardinalCommerce"
    }
    
    // 💳 PayPal (JitPack)
    maven {
        url "https://jitpack.io"
    }
}

android {
    namespace 'com.store.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.store.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        def targetUrl = project.hasProperty('CLIENT_URL') ? project.property('CLIENT_URL') : "https://bellroy.com/"
        buildConfigField "String", "CLIENT_URL", "\"${targetUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 🛡️ مكتبات أندرويد الأساسية
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    
    // 🌐 WebKit
    implementation libs.androidx.webkit
    
    // 🎨 Splash Screen
    implementation libs.androidx.core.splashscreen
    
    // 🔔 OneSignal
    implementation libs.onesignal

    // 🔐 Auth Tab
    implementation libs.androidx.browser
    
    // 🔐 Firebase Authentication
    implementation libs.firebase.auth
    implementation libs.play.services.auth
    
    // 🔐 Facebook Login (من المستودع الصحيح)
    implementation 'com.facebook.android:facebook-login:16.2.1'
    
    // 🔐 Microsoft Authentication Library
    implementation 'com.microsoft.identity.client:msal:5.0.0'
    
    // 💳 Stripe
    implementation 'com.stripe:stripe-android:20.53.0'
    
    // 💳 PayPal (من JitPack)
    implementation 'com.paypal.android:paypal-android-sdk:2.1.0'
    
    // 💳 Braintree Drop-in (من المستودع الصحيح)
    implementation 'com.braintreepayments.api:drop-in:6.0.0'
    
    // 💳 Razorpay
    implementation 'com.razorpay:checkout:1.6.34'
    
    // 💳 Google Pay
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'

    // 🧪 اختبارات
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
