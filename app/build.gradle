plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'com.store.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.store.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        def targetUrl = project.hasProperty('CLIENT_URL') ? project.property('CLIENT_URL') : "https://bellroy.com/"
        buildConfigField "String", "CLIENT_URL", "\"${targetUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ... (المكتبات الأساسية تبقى كما هي) ...

    // 🔐 Auth Tab
    implementation libs.androidx.browser
    
    // 🔐 Firebase Authentication
    implementation libs.firebase.auth
    implementation libs.play.services.auth
    
    // 🔐 Facebook Login (من Maven Central)
    implementation libs.facebook.login
    
    // 🔐 Microsoft Authentication Library (مع استبعاد opentelemetry)
    implementation(libs.msal) {
        exclude group: 'io.opentelemetry'
    }
    // إضافة تبعيات opentelemetry يدوياً (حل مؤقت)
    implementation 'io.opentelemetry:opentelemetry-api:1.18.0'
    implementation 'io.opentelemetry:opentelemetry-context:1.18.0'
    
    // 💳 Stripe
    implementation libs.stripe.android
    
    // 💳 PayPal (باستخدام الـ groupId الصحيح)
    implementation libs.paypal.sdk
    
    // 💳 Braintree Drop-in
    implementation libs.braintree.dropin
    
    // 💳 Razorpay
    implementation libs.razorpay.checkout
    
    // 💳 Google Pay
    implementation libs.play.services.wallet

    // ... (اختبارات) ...
}
